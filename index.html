:root{
  --primary:#1e4fd8;
  --primary-2:#0b2f8f;
  --accent:#f97316;
  --surface:#f1f5fb;
  --card:#ffffff;
  --ink:#101a2e;
  --muted:#66748c;
  --line:#dbe4f0;
  --success:#15803d;
  --danger:#dc2626;
  --warning:#f59e0b;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --surface:#0c1527;
    --card:#14213d;
    --ink:#eef3ff;
    --muted:#a9b7d1;
    --line:#2a3a5c;
  }
}

*{
  box-sizing:border-box
}

html,body,#root{
  margin:0;
  min-height:100%;
  background:var(--surface);
  color:var(--ink);
  font-family:"Avenir Next","Segoe UI",Tahoma,sans-serif
}

button,input,select,textarea{
  font:inherit
}

.card3d{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:0 10px 28px rgba(16,42,96,.10), inset 0 1px 0 rgba(255,255,255,.7)
}

.tab-btn{
  white-space:nowrap;
  border:1px solid var(--line);
  background:var(--card);
  border-radius:999px;
  padding:9px 13px;
  font-size:13px;
  font-weight:750;
  display:inline-flex;
  align-items:center;
  gap:7px;
  cursor:pointer
}

.tab-btn.active{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
  box-shadow:0 6px 18px rgba(30,79,216,.28)
}

.tab-btn.isinma.active{
  background:var(--accent);
  border-color:var(--accent);
  box-shadow:0 6px 18px rgba(249,115,22,.3)
}

.field{
  width:100%;
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 11px;
  background:var(--card);
  color:var(--ink);
  outline:none
}

.field:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(30,79,216,.14)
}

.btn{
  border:0;
  border-radius:10px;
  padding:9px 14px;
  font-weight:800;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px
}

.btn-blue{
  background:var(--primary);
  color:#fff
}

.btn-orange{
  background:var(--accent);
  color:#fff
}

.btn-ghost{
  background:transparent;
  color:var(--primary);
  border:1px solid var(--line)
}

.btn-green{
  background:var(--success);
  color:#fff
}

.btn-red{
  background:#fee2e2;
  color:var(--danger)
}

.btn-dark{
  background:var(--ink);
  color:#fff
}

.small{
  font-size:12px;
  color:var(--muted)
}

table{
  border-collapse:collapse;
  width:100%
}

th{
  font-size:11px;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--muted);
  text-align:left;
  padding:10px;
  border-bottom:1px solid var(--line);
  white-space:nowrap
}

td{
  padding:10px;
  border-bottom:1px solid var(--line);
  font-size:13px;
  white-space:nowrap
}

.pill{
  border-radius:999px;
  padding:4px 9px;
  font-size:11px;
  font-weight:800;
  display:inline-block
}

::-webkit-scrollbar{
  height:8px;
  width:8px
}

::-webkit-scrollbar-thumb{
  background:#c3cede;
  border-radius:99px
}
</style>
